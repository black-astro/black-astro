<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/black-astro/logo.png" />
    <link rel="apple-touch-icon" href="/black-astro/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김현우 · 백엔드 개발자 5년차. 전자고지·대용량 발송/배치 도메인. Java·Spring 레거시 현대화, DB 튜닝, 인증 설계, 오픈소스." />
    <meta property="og:title" content="김현우 · Backend Engineer" />
    <meta property="og:description" content="전자고지·대용량 발송/배치 도메인을 5년간 설계·개발·운영한 백엔드 개발자" />
    <meta property="og:type" content="website" />
    <title>김현우 · Backend Engineer</title>
    <script>
      // 첫 페인트 전에 테마 적용 (저장값 없으면 다크 기본). 배경은 CSS 변수가 담당.
      (function () {
        try {
          var s = localStorage.getItem('ba-theme')
          document.documentElement.setAttribute('data-theme', s === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
