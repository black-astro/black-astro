<div class="tabbar" role="tablist" aria-label="주제 탭" id="tabbar">

    <span id="tabcurTxt">🧭 시작 · 개념</span><span class="ar">▾</span>
  </button>
  <div class="tabs" id="tabs">
    <button class="st" data-t="start"  onclick="switchTab('start')"  role="tab" aria-selected="true"><span class="ic">🧭</span> 시작 · 개념<span class="k">1</span></button>
    <button class="ng" data-t="nginx"  onclick="switchTab('nginx')"  role="tab" aria-selected="false"><span class="ic">🟩</span> Nginx<span class="k">2</span></button>
    <button class="ap" data-t="apache" onclick="switchTab('apache')" role="tab" aria-selected="false"><span class="ic">🪶</span> Apache<span class="k">3</span></button>
    <button class="tc" data-t="tomcat" onclick="switchTab('tomcat')" role="tab" aria-selected="false"><span class="ic">🐱</span> Tomcat<span class="k">4</span></button>
    <button class="cd" data-t="caddy"  onclick="switchTab('caddy')"  role="tab" aria-selected="false"><span class="ic">🔒</span> Caddy<span class="k">5</span></button>
    <button class="ts" data-t="tls"    onclick="switchTab('tls')"    role="tab" aria-selected="false"><span class="ic">🔐</span> HTTPS · 인증서<span class="k">6</span></button>
    <button class="lg" data-t="lang"   onclick="switchTab('lang')"   role="tab" aria-selected="false"><span class="ic">🔗</span> 언어별 연동<span class="k">7</span></button>
    <button class="pf" data-t="perf"   onclick="switchTab('perf')"   role="tab" aria-selected="false"><span class="ic">⚡</span> 성능 · 튜닝<span class="k">8</span></button>
    <button class="lb" data-t="lb"     onclick="switchTab('lb')"     role="tab" aria-selected="false"><span class="ic">⚖️</span> 로드밸런싱<span class="k">9</span></button>
    <button class="op" data-t="ops"    onclick="switchTab('ops')"    role="tab" aria-selected="false"><span class="ic">🛡️</span> 보안 · 운영<span class="k">0</span></button>
    <button class="dp" data-t="deep"   onclick="switchTab('deep')"   role="tab" aria-selected="false"><span class="ic">🧬</span> 전문가 · 내부</button>
    <a class="tablink" href="../db-web/" title="데이터베이스(Oracle·PostgreSQL·MySQL·SQLite) 가이드로 이동">
      <span class="ic">🗄️</span> DB 가이드<span class="ext">↗</span></a>
    <a class="tablink" href="../python-web/" title="파이썬 가이드로 이동">
      <span class="ic">🐍</span> Python 가이드<span class="ext">↗</span></a>
    <a class="tablink" href="../java-web/" title="자바 · Spring Boot 가이드로 이동">
      <span class="ic">☕</span> Java 가이드<span class="ext">↗</span></a>
    <a class="tablink" href="../js-ts-web/" title="JavaScript · TypeScript 가이드로 이동">
      <span class="ic">🟨</span> JS · TS 가이드<span class="ext">↗</span></a>
  </div>
  <button class="lvfind" id="lvFind" onclick="findOpen()" title="전체 검색 (Ctrl+K)"

  <button class="lvtoc" id="lvToc" onclick="tocOpen()" title="현재 탭 목차 열기"
          aria-haspopup="dialog"><span class="ic">📑</span> 목차</button>
</div>
