<!-- @model gantt | 간트 · 스케줄 바 | 무엇이 언제부터 언제까지 걸리는가 -->
<!-- @when 야간 배치 창 · 배포 절차 · 작업 의존처럼 겹침과 순서가 핵심일 때. -->
<!-- @avoid 한 줄짜리 소요 분해라면 waterfall 이 더 정확합니다. -->
<div class="diag rv">

    <text x="16" y="18" class="lbl">야간 배치 창 — 세로 붉은 선이 마감(05:00)입니다</text>

    <text x="640" y="216" class="tk" text-anchor="middle">05:00</text>

    <text x="16" y="50" class="ann">파일 수신</text>
    <rect class="bar" x="150" y="38" width="82" height="16"/>

    <rect class="bar" x="298" y="90" width="180" height="16"/>

<!-- @model waterfall | 워터폴 트레이스 | 한 번의 요청에서 시간이 어디로 갔나 -->
<!-- @when 지연 분석 · 콜드 스타트 · N+1 진단처럼 구간별 소요가 핵심일 때. -->
<!-- @avoid 여러 작업의 일정이면 gantt. 총량 비교면 bar. -->
<div class="diag rv">
  <svg viewBox="0 0 680 244" role="img" aria-label="느린 API 요청의 구간별 소요 시간 워터폴. 전체 840밀리초 중 데이터베이스 조회가 여섯 번 반복되어 610밀리초를 차지하며 이것이 N 더하기 1 문제다. 나머지 구간은 모두 합쳐 230밀리초다">
    <text x="16" y="18" class="lbl">GET /orders/1024 — 총 840 ms 가 어디로 갔는가</text>

    <path class="ax" d="M182 196 L648 196"/>
    <path class="gr" d="M182 34 L182 196"/>
    <path class="gr" d="M298 34 L298 196"/>
    <path class="gr" d="M414 34 L414 196"/>
    <path class="gr" d="M530 34 L530 196"/>

    <text x="414" y="212" class="tk" text-anchor="middle">400</text>

    <text x="16" y="68" class="ann">모델 바인딩</text>
    <rect class="bar" x="208" y="56" width="12" height="14"/>
    <text x="226" y="68" class="tk">20 ms</text>

    <text x="16" y="90" class="ann">DB 조회 ①</text>
    <rect class="bar" x="220" y="78" width="30" height="14"/>
    <text x="256" y="90" class="tk">52 ms</text>

    <text x="16" y="112" class="ann rs-t">DB 조회 ②~⑥</text>
    <rect x="250" y="100" width="322" height="14" style="fill:rgba(251,113,133,.22);stroke:rgba(251,113,133,.55);stroke-width:1;rx:3"/>

  </svg>

<!-- @model cycle | 순환 · 생명주기 | 끝이 다시 처음으로 돌아오는 과정 -->

<!-- @avoid 한 번 끝나면 그만인 절차는 flow 나 pipe. -->

    <text x="16" y="18" class="lbl">한 바퀴가 끝나면 다음 장애의 감지가 좋아집니다</text>
