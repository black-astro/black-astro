<!--
  ⚠️ 이 파일은 자동 생성물입니다. 여기를 고치면 다음 빌드에서 지워집니다.

  원본(조각)  web/guide-src/java/parts/**   ← 편집은 여기서
  빌더        web/guide-src/build.mjs
  순서 정의   web/guide-src/java/parts.json ← 조각을 추가/삭제하면 여기도 같이
  설명서      web/guide-src/README.md

  ── 사용법 (web/ 에서 실행) ────────────────────────────────
    npm run dev:guide      조각이 바뀌면 자동 재빌드 (작업 중엔 이걸 켜두세요)
    npm run build:guide    한 번만 빌드 (python·java 둘 다)
    npm run check:guide    결과물이 조각과 일치하는지 검사만 (커밋 전 확인)
    npm run build          사이트 전체 빌드 — 가이드 빌드가 자동 선행됩니다

  ── 어디를 고쳐야 하나 ─────────────────────────────────────
    섹션 내용        parts/panes/<탭>.html
    좌측 목차·링크   parts/11-sidebar.html   (검색 색인이 이 링크에서 만들어짐)
    검색어·난이도    parts/js/20-tab-switch.js  의 SEC_KW / SEC_LV
    "쉽게 말하면"    parts/js/20-tab-switch.js  의 EZ
    스타일           parts/css/*.css  (01~05 는 파이썬 가이드와 동일 · 06 이 자바 전용)
    데모 스크립트    parts/js/90-demos.js       (최초 실행은 99-init.js)

  섹션을 하나 추가할 때는 위 4곳(pane · sidebar · SEC_KW/SEC_LV · EZ)을
  함께 고쳐야 화면·검색·요약이 전부 맞습니다.

  빌더는 조각을 '이어붙이기만' 합니다(가공 없음).
  그래서 조각을 건드리지 않으면 결과물도 바이트 단위로 동일합니다.
-->
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<script>
/* 테마 · 읽기 옵션 선적용 — 첫 그리기 전에 붙여야 라이트에서 어두운 화면이 번쩍이거나
   접어 둔 사이드바가 잠깐 보였다 사라지지 않는다. 전 가이드 공통 키.
   lx:theme = light | dark (없으면 OS 설정) · lx:prefs = {fs, lh, side, head, focus} */
(function(){var d=document.documentElement,t,p={};
try{t=localStorage.getItem("lx:theme");p=JSON.parse(localStorage.getItem("lx:prefs")||"{}")||{}}catch(e){}
if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
d.setAttribute("data-theme",t);
if(p.fs&&p.fs!=="m")d.setAttribute("data-fs",p.fs);
if(p.lh==="w")d.setAttribute("data-lh","w");
if(p.side)d.className+=" lx-side-off";
if(p.head)d.className+=" lx-head-off";
if(p.focus)d.className+=" lx-focus";
try{if(localStorage.getItem("dvg-hello"))d.className+=" lx-hello-off"}catch(e){}})();
</script>
