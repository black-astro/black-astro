name: 📝 Latest Blog Post Workflow

on:
  # 매시간 정각 자동 갱신
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Pull in latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # ⚠️ 아래 RSS 주소를 본인 블로그 RSS 로 교체하세요.
          #   - 티스토리 : https://블로그주소/rss
          #   - 벨로그   : https://v2.velog.io/rss/@아이디
          #   - 미디엄   : https://medium.com/feed/@아이디
          feed_list: "https://REPLACE-ME-WITH-YOUR-BLOG/rss"
          max_post_count: 5
          template: "$emojiValue [$title]($url) &nbsp;·&nbsp; <sub>$date</sub><br/>"
          date_format: "yyyy-MM-dd"
          # README 의 마커 사이를 자동으로 채웁니다.
          comment_tag_name: "BLOG-POST-LIST"
